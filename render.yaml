services:
  - type: web
    name: music-share-backend
    env: python
    region: oregon
    plan: free
    # Render will run all commands from the backend/ folder
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # gunicorn runs app:app directly since we're already inside backend/
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "https://musicsharebreidi.vercel.app"
      - key: JWT_SECRET_KEY
        value: "replace-with-a-strong-secret"
      # If you use a managed DB, set DATABASE_URL in Render (Postgres/Redis/etc)
      # - key: DATABASE_URL
      #   value: "postgres://user:pass@host:5432/dbname"
