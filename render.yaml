services:
  - type: web
    name: music-share-backend
    env: python
    region: oregon
    plan: free
    # Build installs dependencies from the backend requirements file
    buildCommand: pip install -r backend/requirements.txt
    # Run Gunicorn using the shared config, which binds to $PORT
    startCommand: gunicorn -c gunicorn.conf.py
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "https://musicsharebreidi.vercel.app"
      - key: JWT_SECRET_KEY
        value: "replace-with-a-strong-secret"
      # If you use a managed DB, set DATABASE_URL in Render (Postgres/Redis/etc)
      # - key: DATABASE_URL
      #   value: "postgres://user:pass@host:5432/dbname"
