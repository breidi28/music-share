providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["cd backend && python -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = "cd backend && . /opt/venv/bin/activate && python -c \"from app import db, app; app.app_context().push(); db.create_all()\" && gunicorn app:app --bind 0.0.0.0:$PORT"